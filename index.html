<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suki Mini POS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #ffffff;
      color: #333333;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #d9534f;
    }
    .section-title {
      font-size: 1.2rem;
      margin-bottom: 10px;
      border-bottom: 2px solid #eee;
      padding-bottom: 5px;
    }
    .menu-container {
      margin-bottom: 25px;
    }
    .menu-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #fafafa;
    }
    .menu-info {
      font-size: 1rem;
    }
    .menu-price {
      font-weight: bold;
      color: #27ae60;
    }
    .btn-add {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-add:active {
      background-color: #219150;
    }
    .cart-container {
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      padding: 15px;
      background-color: #ffffff;
    }
    .cart-list {
      list-style: none;
      margin-bottom: 15px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #eee;
    }
    .empty-cart {
      text-align: center;
      color: #888;
      padding: 10px 0;
    }
    .total-container {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 2px solid #333;
    }
    .btn-clear {
      width: 100%;
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 15px;
    }
    .btn-clear:active {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <h1>🍲 Suki Mini POS</h1>

  <!-- ส่วนแสดงเมนู -->
  <div class="menu-container">
    <h2 class="section-title">รายการเมนู</h2>
    <div class="menu-card">
      <div class="menu-info">
        <strong>ชุดหมู</strong> - <span class="menu-price">199 บาท</span>
      </div>
      <button class="btn-add" onclick="addToCart('ชุดหมู', 199)">+ เพิ่ม</button>
    </div>
    <div class="menu-card">
      <div class="menu-info">
        <strong>ชุดเนื้อ</strong> - <span class="menu-price">249 บาท</span>
      </div>
      <button class="btn-add" onclick="addToCart('ชุดเนื้อ', 249)">+ เพิ่ม</button>
    </div>
    <div class="menu-card">
      <div class="menu-info">
        <strong>น้ำดื่ม</strong> - <span class="menu-price">20 บาท</span>
      </div>
      <button class="btn-add" onclick="addToCart('น้ำดื่ม', 20)">+ เพิ่ม</button>
    </div>
  </div>

  <!-- ส่วนแสดงตะกร้าสินค้า -->
  <div class="cart-container">
    <h2 class="section-title">ตะกร้าสินค้า</h2>
    <ul id="cartList" class="cart-list">
      <li class="empty-cart">ยังไม่มีรายการสินค้า</li>
    </ul>

    <div class="total-container">
      <span>ราคารวมทั้งหมด:</span>
      <span id="totalPrice">0 บาท</span>
    </div>

    <button class="btn-clear" onclick="clearCart()">ล้างตะกร้า</button>
  </div>

  <script>
    // โครงสร้างข้อมูลตะกร้าสินค้า
    let cart = {};

    // ฟังก์ชันเพิ่มสินค้าเข้าตะกร้า
    function addToCart(name, price) {
      if (cart[name]) {
        cart[name].qty += 1;
      } else {
        cart[name] = { price: price, qty: 1 };
      }
      renderCart();
    }

    // ฟังก์ชันล้างตะกร้าสินค้า
    function clearCart() {
      cart = {};
      renderCart();
    }

    // ฟังก์ชันแสดงผลรายการและคำนวณราคารวม
    function renderCart() {
      const cartList = document.getElementById('cartList');
      const totalPriceEl = document.getElementById('totalPrice');
      
      cartList.innerHTML = '';
      let total = 0;
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartList.innerHTML = '<li class="empty-cart">ยังไม่มีรายการสินค้า</li>';
        totalPriceEl.textContent = '0 บาท';
        return;
      }

      keys.forEach(name => {
        const item = cart[name];
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <span>${name} x ${item.qty}</span>
          <span>${itemTotal.toLocaleString()} บาท</span>
        `;
        cartList.appendChild(li);
      });

      totalPriceEl.textContent = `${total.toLocaleString()} บาท`;
    }
  </script>
</body>
</html>
